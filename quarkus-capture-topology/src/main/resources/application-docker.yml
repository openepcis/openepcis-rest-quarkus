quarkus:
  opensearch:
    hosts: openepcis-opensearch:9200
  s3:
    endpoint-override: "${S3_ENDPOINT_OVERRIDE:http://openepcis-minio:9000}"
    aws:
      region: "us-east-1"
      credentials:
        type: static
        static-provider:
          access-key-id: "root"
          secret-access-key: "openepcis"
    sync-client:
      type: apache
  jobrunr:
    background-job-server:
      enabled: 'false'
    dashboard:
      enabled: 'false'
