s3:
  bucket: openepcis
  json-schema-key-prefix: "json-schema/"
  xsd-schema-key-prefix: "xsd-schema/"
  document-key-prefix-date-format: "'capture-document/'yyyy/MM/dd/"

storage:
  factory-name: "${STORAGE_FACTORY:${STORAGE_TYPE:local}}"
  bucket: openepcis
  document-key-prefix-date-format: "'capture-document/'yyyy/MM/dd/"
  event-key-prefix-date-format: "'epcis-event/'yyyy/MM/dd/"
  json-schema-key-prefix: "json-schema/"

repository:
  user:
    extension:
      fields:
        index: user-extension-fields
      schema:
        index: user-extension-schema
  epcis:
    event:
      index: epcis-event
    query:
      index: epcis-query
    subscription:
      index: epcis-subscription
    next-page-token-ttl: 1m
    per-page-default: 30
    per-page-max: 100
    top-level:
      per-page-default: 100
      per-page-max: 1000

  capture:
    job:
      index: capture-job

etcd:
  host: "${ETCD_HOST:openepcis-etcd}"

quarkus:
  otel:
    enabled: true
    traces:
      enabled: true
  log:
    level: INFO
    category:
      "org.opensearch.client.RestClient":
        level: ERROR
    console:
      format: "%d{yyyy-MM-dd HH:mm:ss} %-5p [%X{traceId}, %X{spanId}] [%c{2.}] (%t) %s%e%n"
    file:
      enable: true
      path: logs/openepcis.log
      format: "%d{yyyy-MM-dd HH:mm:ss} %-5p [%X{traceId}, %X{spanId}] [%c{2.}] (%t) %s%e%n"
  opensearch:
    hosts: ${QUARKUS_OPENSEARCH_HOSTS:localhost:9200}
  s3:
    endpoint-override: "${S3_ENDPOINT_OVERRIDE:http://127.0.0.1:9100}"
    path-style-access: true
    aws:
      region: "us-east-1"
      credentials:
        type: static
        static-provider:
          access-key-id: "root"
          secret-access-key: "openepcis"
    sync-client:
      type: apache


kafka-streams:
  num:
    stream:
      threads: "${KAFKA_STREAMS_NUM_STREAM_THREADS:1}"
  consumer:
    "max.poll.records": 10
    # Headroom so a slow batch (e.g. large events read from S3) cannot trip the
    # poll-interval eviction that puts the topology into a rebalance/reprocess loop.
    # The per-event reactive side effects are independently bounded in code
    # (PERSIST_TIMEOUT + retry), so this is defensive margin, not the primary guard.
    "max.poll.interval.ms": 600000
    "fetch.max.bytes": 1048576
    "max.partition.fetch.bytes": 524288
  cache:
    "max.bytes.buffering": 1048576
  commit:
    "interval.ms": "${KAFKA_STREAMS_COMMIT_INTERVAL_MS:1000}"
  # One record that cannot be processed or read is logged and skipped; it does not stop the
  # stream for everyone. An uncaught exception still ends only the thread, which
  # CaptureStreamsUncaughtExceptionHandler replaces.
  processing:
    exception:
      handler: org.apache.kafka.streams.errors.LogAndContinueProcessingExceptionHandler
  deserialization:
    exception:
      handler: org.apache.kafka.streams.errors.LogAndContinueExceptionHandler

# Bounded worker pool for the @Blocking EventPersistenceProcessor. Caps how many events persist
# concurrently (natural back-pressure), so a burst can never spawn unbounded in-flight OpenSearch
# writes. Sized alongside the OpenSearch client connection pool.
smallrye:
  messaging:
    worker:
      event-persistence-pool:
        max-concurrency: 5

mp:
  messaging:
    outgoing:
      websocket-subscription-out:
        topic: websocket-subscription
        connector: smallrye-kafka
        value:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
      event-saved-out:
        topic: event-saved
        connector: smallrye-kafka
        value:
          serializer: io.quarkus.kafka.client.serialization.JsonbSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
      event-captured-out:
        topic: epcis-event-captured
        connector: smallrye-kafka
        value:
          serializer: io.quarkus.kafka.client.serialization.JsonbSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
      capture-document-out:
        topic: capture-documents
        connector: smallrye-kafka
        merge: true
        value:
          serializer: io.quarkus.kafka.client.serialization.JsonbSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
      capture-document-event-out:
        topic: capture-document-event
        connector: smallrye-kafka
        merge: true
        value:
          serializer: io.quarkus.kafka.client.serialization.JsonbSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
      capture-document-event-error-out:
        topic: capture-document-event-error
        connector: smallrye-kafka
        merge: true
        value:
          serializer: io.quarkus.kafka.client.serialization.JsonbSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
      capture-document-event-count-out:
        topic: capture-document-event-count
        connector: smallrye-kafka
        merge: true
        value:
          serializer: io.quarkus.kafka.client.serialization.JsonbSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
      epcis-event-validated-success-out:
        topic: epcis-event-validated-success
        connector: smallrye-kafka
        merge: true
        value:
          serializer: io.quarkus.kafka.client.serialization.JsonbSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
      epcis-event-validated-failure-out:
        topic: epcis-event-validated-failure
        connector: smallrye-kafka
        merge: true
        value:
          serializer: io.quarkus.kafka.client.serialization.JsonbSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
      # Processed marker produced by EventPersistenceProcessor; consumed by the Kafka Streams
      # captureInfoStream (topic epcis-event-persisted) to increment the PROCESSED count.
      epcis-event-persisted-out:
        topic: epcis-event-persisted
        connector: smallrye-kafka
        merge: true
        value:
          serializer: io.quarkus.kafka.client.serialization.JsonbSerializer
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
    incoming:
      # Query results for WebSocket sessions. The result is produced on one pod (the one that
      # percolated the event, or ran the scheduled query) and the session may be held by another,
      # so every pod reads every result: a consumer group per process start, from the latest
      # offset, and QueriesWebSocket keeps what belongs to its own sessions.
      websocket-subscription:
        topic: websocket-subscription
        connector: smallrye-kafka
        group:
          id: websocket-${quarkus.uuid}
        auto:
          offset:
            reset: latest
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        key:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
      event-saved-in:
        topic: event-saved
        group:
          id: streaming-consumer-group
        connector: smallrye-kafka
        value:
          deserializer: io.openepcis.capture.kafka.EventSavedMessageDeserializer
        key:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
      event-saved-in-epc-consumer:
        topic: event-saved
        group:
          id: epc-consumer-group
        connector: smallrye-kafka
        value:
          deserializer: io.openepcis.capture.kafka.EventSavedMessageDeserializer
        key:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Reactive-messaging persistence stage (EventPersistenceProcessor). Consumes validated
      # events, persists them (bounded + retried) and produces the processed marker. A definitive
      # (non-recoverable) failure is nacked to the dead-letter queue instead of being reprocessed
      # forever. Bounded concurrency is set via smallrye.messaging.worker.event-persistence-pool.
      epcis-event-validated-success-in:
        topic: epcis-event-validated-success
        group:
          id: event-persistence-consumer-group
        connector: smallrye-kafka
        value:
          deserializer: io.openepcis.capture.kafka.EPCISValidationMessageDeserializer
        key:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: epcis-event-validated-success-dlq
        throttled:
          unprocessed-record-max-age.ms: 900000


