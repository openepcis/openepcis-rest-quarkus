name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # No credentials of any kind: everything this reactor needs resolves from Maven Central
      # and its snapshot repository. That is the point of the Community Edition.
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Check the licence headers
        run: ./mvnw --batch-mode --no-transfer-progress -Papache-license license:check
